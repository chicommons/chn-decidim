version: '3'
services:
  decidim:
    #image: decidim/decidim:0.31.6
    build: .
    volumes:
      - .:/code
      - bundle:/usr/local/bundle
      - node_modules:/app/node_modules
    environment:
      - PORT=4100
      - DATABASE_HOST=pg
      - DATABASE_USERNAME=postgres
      - RAILS_ENV=development
    ports:
      - 4100:4100
    links:
      - pg
    command: bundle exec puma
  pg:
    image: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
volumes:
  node_modules: {}
  bundle: {}
  pg-data: {}
